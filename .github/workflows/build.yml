
name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      REPO:
        description: '📦 Kernel repository'
        default: 'blxyzY/android_kernel_samsung_sm6225.git'
        required: true
      BRANCH:
        description: '🌿 Kernel branch'
        default: ''
        required: true
      DEVICE_TARGET:
        description: '📱 Target device to build'
        default: 'A235F'
        required: true
      DEFCONFIG:
        description: '⚙️ Defconfig name'
        required: true
        default: 'a23_eur_open_defconfig'
      ZIP_NAME:
        description: '📦 Custom ZIP name'
        required: false
        default: 'SolsticeKernel-A23-'
        type: string
      LTO:
        description: '🔗 Link Time Optimisation'
        required: true
        default: 'thin'
        type: choice
        options:
          - none
          - thin
      CLANG_VERSION:
        description: '🔧 Clang'
        required: true
        default: 'neutron-clang23'
        type: choice
        options:
          - neutron-clang23
          - aosp-23
          - aosp-22
          - aosp-21
          - aosp-20
          - aosp-12
      SELINUX:
        description: '🔒 SELinux mode'
        required: true
        default: 'enforcing'
        type: choice
        options:
          - enforcing
          - permissive
      KSU:
        description: '🔑 Add KernelSU support'
        type: boolean
        default: true
      KSU_BRANCH:
        description: '🌿 KernelSU branch'
        required: true
        default: 'xxksu'
      KCFLAGS_W:
        description: '🛡️ Enable KCFLAGS=-w'
        type: boolean
        default: true
      UPDATE_TOOLCHAIN:
        description: '🔄 Force update toolchain'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🕐 Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: 📥 Clone kernel source
      run: |
        git clone --depth=1 --single-branch -b ${{ github.event.inputs.BRANCH }} --recursive https://github.com/${{ github.event.inputs.REPO }} kernel_root

    - name: 💾 Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: |
          ~/neutron-clang
          ~/androidcc
        key: clang-${{ github.event.inputs.CLANG_VERSION }}-v2
        restore-keys: |
          clang-${{ github.event.inputs.CLANG_VERSION }}-

    - name: 🚀 Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ github.sha }}
        restore-keys: ccache-kernel-

    - name: 🛠️ Prepare Dependencies
      run: chmod +x ./build.sh && bash ./build.sh --setup-deps

    - name: 🔧 Setup Build Environment
      id: buildKernel
      run: |
        cd kernel_root
        gitsha1=$(git rev-parse --short HEAD)
        CODENAME=$(cat ../codename 2>/dev/null || echo "kernel")
        KERNEL_VER=$(make kernelversion 2>/dev/null || echo "unknown")
        if [ -n "${{ github.event.inputs.ZIP_NAME }}" ]; then
          buildDetails="${{ github.event.inputs.ZIP_NAME }}"
        else
          buildDetails="$CODENAME-$KERNEL_VER-$gitsha1"
        fi
        echo "buildDetails=$buildDetails" >> $GITHUB_OUTPUT
        echo "currDate=$(date)" >> $GITHUB_OUTPUT
        echo "kernelVer=$KERNEL_VER" >> $GITHUB_OUTPUT
        echo "gitsha=$gitsha1" >> $GITHUB_OUTPUT

    - name: 📦 Fetch Toolchains
      if: ${{ steps.cache-toolchain.outputs.cache-hit != 'true' || github.event.inputs.UPDATE_TOOLCHAIN == 'true' }}
      env:
        UPDATE_TOOLCHAINS: ${{ github.event.inputs.UPDATE_TOOLCHAIN }}
        CLANG_VERSION: ${{ github.event.inputs.CLANG_VERSION }}
      run: bash ./build.sh --fetch-toolchains

    - name: ⚡ Build Kernel
      env:
        BRANCH: ${{ github.event.inputs.BRANCH }}
        TG_TOKEN: ${{ secrets.BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        DEVICE_TARGET: ${{ github.event.inputs.DEVICE_TARGET }}
        DEFCONFIG: ${{ github.event.inputs.DEFCONFIG }}
        LTO: ${{ github.event.inputs.LTO }}
        KSU: ${{ github.event.inputs.KSU }}
        SELINUX: ${{ github.event.inputs.SELINUX }}
        CLANG_VERSION: ${{ github.event.inputs.CLANG_VERSION }}
        CI_ZIPNAME: "${{ steps.buildKernel.outputs.buildDetails }}.zip"
        KCFLAGS_W: ${{ github.event.inputs.KCFLAGS_W }}
      run: |
        cd kernel_root
        if [ ! -d ~/.ccache ]; then
          mkdir -p ~/.ccache
        fi
        
        device_defconfig="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG }}"
        
        # ===== HANDLE KernelSU =====
        if [[ "$KSU" == "true" ]]; then
          echo "🔑 Adding KernelSU support..."
          
          if ! curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/xxksu/kernel/setup.sh" | bash -s "${{ github.event.inputs.KSU_BRANCH }}"; then
            echo "❌ Failed to setup KernelSU!"
            exit 1
          fi
          
          # Verify KernelSU folder exists
          if [ ! -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
            echo "⚠️ KernelSU folder not found, checking..."
            ls -la | grep -i ksu
          fi
          
          echo "CONFIG_KSU=y" >> "$device_defconfig"
          echo "CONFIG_KSU_DEBUG=n" >> "$device_defconfig"
          echo "CONFIG_KSU_TOOLKIT=n" >> "$device_defconfig"
          echo "CONFIG_KSU_EXTRAS=n" >> "$device_defconfig"
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=n" >> "$device_defconfig"
          
          echo "✅ KernelSU added successfully!"
        fi
        
        # ===== HANDLE SELinux =====
        if [[ "${{ github.event.inputs.SELINUX }}" == "permissive" ]]; then
          echo "🔓 Configuring kernel to SELinux Permissive..."
          
          # Fix CMDLINE (aman untuk yang sudah ada)
          if grep -q "CONFIG_CMDLINE=" "$device_defconfig"; then
            if ! grep -q "androidboot.selinux=permissive" "$device_defconfig"; then
              sed -i 's/CONFIG_CMDLINE="\(.*\)"/CONFIG_CMDLINE="\1 androidboot.selinux=permissive"/' "$device_defconfig"
            fi
          else
            echo 'CONFIG_CMDLINE="androidboot.selinux=permissive"' >> "$device_defconfig"
          fi
          
          # Enable DEVELOP
          if grep -q "CONFIG_SECURITY_SELINUX_DEVELOP" "$device_defconfig"; then
            sed -i 's/# CONFIG_SECURITY_SELINUX_DEVELOP is not set/CONFIG_SECURITY_SELINUX_DEVELOP=y/' "$device_defconfig"
          else
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$device_defconfig"
          fi
          
          # Disable ENFORCE
          sed -i 's/CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE=y/# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set/' "$device_defconfig" 2>/dev/null || true
          
          # Enable PERMISSIVE
          if grep -q "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE" "$device_defconfig"; then
            sed -i 's/# CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE is not set/CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y/' "$device_defconfig"
          else
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y" >> "$device_defconfig"
          fi
          
          # Disable Samsung security features
          sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/' "$device_defconfig" 2>/dev/null || true
          sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/' "$device_defconfig" 2>/dev/null || true
          sed -i 's/CONFIG_FIVE=y/# CONFIG_FIVE is not set/' "$device_defconfig" 2>/dev/null || true
          
          echo "✅ SELinux: Permissive mode configured 🔓"
        else
          echo "🔒 Configuring kernel to SELinux Enforcing..."
          
          # Disable PERMISSIVE
          sed -i 's/CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y/# CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE is not set/' "$device_defconfig" 2>/dev/null || true
          
          # Enable ENFORCE
          if grep -q "CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE" "$device_defconfig"; then
            sed -i 's/# CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE is not set/CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE=y/' "$device_defconfig"
          else
            echo "CONFIG_SECURITY_SELINUX_ALWAYS_ENFORCE=y" >> "$device_defconfig"
          fi
          
          # Remove permissive from CMDLINE
          if grep -q "CONFIG_CMDLINE=" "$device_defconfig"; then
            sed -i 's/ androidboot.selinux=permissive//g' "$device_defconfig"
            sed -i 's/androidboot.selinux=permissive //g' "$device_defconfig"
            sed -i 's/androidboot.selinux=permissive//g' "$device_defconfig"
          fi
          
          echo "✅ SELinux: Enforcing mode configured 🔒"
        fi

        echo "🚀 Starting kernel build..."
        bash ../build.sh

    - name: 📤 Upload kernel artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
        path: |
          kernel_root/*.zip
          kernel_root/out/.config
          kernel_root/boot.img
          kernel_root/dtbo.img
          
