name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      REPO:
        description: 'Kernel repository'
        default: 'blxyzY/android_kernel_samsung_sm6225.git'
        required: true
      BRANCH:
        description: 'Kernel branch'
        default: ''
        required: true
      DEVICE_TARGET:
        description: 'Target device to build'
        default: 'a23nsxx'
        required: true
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: ''
      LTO:
        description: 'Link Time Optimisation'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - thin
          - full
      KCFLAGS_W:
        description: 'Enable KCFLAGS=-w'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Clone kernel source
      run: |
        REPO="${{ github.event.inputs.REPO }}"
        BRANCH="${{ github.event.inputs.BRANCH }}"
        
        if [ -z "$BRANCH" ]; then
          git clone --depth=1 --recursive "$REPO" kernel_root
        else
          git clone --depth=1 -b "$BRANCH" --recursive "$REPO" kernel_root
        fi
    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: ~/neutron-clang
        key: neutron-clang-23

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ github.sha }}
        restore-keys: ccache-kernel-

    - name: Prepare Dependencies
      run: chmod +x ./build.sh && bash ./build.sh --setup-deps

    - name: Setup Build Environment
      id: buildKernel
      run: |
        cd kernel_root
        gitsha1=$(git rev-parse --short HEAD)
        CODENAME=$(cat ../codename 2>/dev/null || echo "kernel")
        KERNEL_VER=$(make kernelversion 2>/dev/null || echo "unknown")
        echo "buildDetails=$CODENAME-$KERNEL_VER-$gitsha1-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        echo "currDate=$(date)" >> $GITHUB_OUTPUT
        echo "kernelVer=$KERNEL_VER" >> $GITHUB_OUTPUT
        echo "gitsha=$gitsha1" >> $GITHUB_OUTPUT

    - name: Fetch Toolchains
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: bash ./build.sh --fetch-toolchains

    - name: Build Kernel
      env:
        BRANCH: ${{ github.event.inputs.BRANCH }}
        TG_TOKEN: ${{ secrets.BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        DEVICE_TARGET: ${{ github.event.inputs.DEVICE_TARGET }}
        DEFCONFIG: ${{ github.event.inputs.DEFCONFIG }}
        LTO: ${{ github.event.inputs.LTO }}
        CI_ZIPNAME: "${{ steps.buildKernel.outputs.buildDetails }}.zip"
        KCFLAGS_W: "${{ github.event.inputs.KCFLAGS_W }}"
      run: |
        cd kernel_root
        if [ ! -d ~/.ccache ]; then
          mkdir -p ~/.ccache
        fi
        bash ../build.sh

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
        path: |
          kernel_root/*.zip
          kernel_root/out/.config
          
